<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIKUA BOX 진출 진단</title>
<style>
  /* Layout: single-column stepper on a branded navy canvas; one question per card, sticky progress, result screen with CTA. Dark-first (brand), light variant provided. */
  :root{
    --bg:#0b1733; --surface:#111f42; --surface2:#16254d; --line:#28385f;
    --fg:#f3f5fb; --muted:#9aa6c4; --accent:#f5a623; --accent-ink:#0b1733;
    --ok:#58c08a; --sel:#1d3568;
    --radius:14px; --maxw:720px;
    color-scheme:dark;
    --display:"Noto Sans KR",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f7fc; --surface:#ffffff; --surface2:#eef2fb; --line:#d9e1f0;
      --fg:#0b1733; --muted:#5a668c; --accent:#d98407; --accent-ink:#ffffff;
      --sel:#e9f0ff; color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#f4f7fc; --surface:#ffffff; --surface2:#eef2fb; --line:#d9e1f0;
    --fg:#0b1733; --muted:#5a668c; --accent:#d98407; --accent-ink:#ffffff;
    --sel:#e9f0ff; color-scheme:light;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--display);line-height:1.6;margin:0}
  .wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
  a{color:var(--accent)}
  .kicker{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.14em}
  /* header */
  header{padding-block:18px 10px}
  .hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  header h1{font-size:22px;font-weight:800;margin:6px 0 2px}
  header p{color:var(--muted);font-size:13px;margin:0}
  /* language switch */
  .langsw{display:inline-flex;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
  .langsw button{background:transparent;border:none;color:var(--muted);font-size:12px;font-weight:700;font-family:inherit;padding:5px 9px;border-radius:7px;cursor:pointer}
  .langsw button.on{background:var(--accent);color:var(--accent-ink)}
  /* progress */
  .prog{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px 12px;z-index:5}
  .bar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .25s ease}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
  /* card */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .cat{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
  .q{font-size:19px;font-weight:700;margin:8px 0 18px;text-wrap:balance}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);cursor:pointer;font-size:15px;transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent);background:var(--sel)}
  .opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
  .opt.sel .dot{border-color:var(--accent)}
  .opt.sel .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* followup */
  .followup{margin-top:14px}
  .followup.hide{display:none}
  .followup label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted)}
  .followup textarea{width:100%;background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:15px;color:var(--fg);resize:vertical}
  .followup textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  /* nav */
  .nav{display:flex;gap:12px;margin-top:20px}
  button{font-family:inherit;font-size:15px;font-weight:700;border-radius:12px;padding:13px 20px;cursor:pointer;border:1.5px solid var(--line)}
  .btn-ghost{background:transparent;color:var(--fg)}
  .btn-ghost:disabled{opacity:.35;cursor:not-allowed}
  .btn-next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
  .btn-next:disabled{opacity:.4;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* result */
  .score-wrap{text-align:center;padding:10px 0 4px}
  .ring{--p:0;width:170px;height:170px;margin:4px auto 10px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(closest-side,var(--surface) 72%,transparent 73% 100%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0)}
  .ring .n{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .ring .n small{font-size:16px;color:var(--muted);font-weight:600}
  .grade{display:inline-block;font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px;background:var(--sel);color:var(--accent);margin-top:2px}
  .verdict{font-size:15px;margin:14px 2px 0;color:var(--fg)}
  .recs{display:grid;gap:12px;margin-top:18px}
  .rec{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .rec .l{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;text-transform:uppercase}
  .rec .v{font-size:15px;font-weight:700;margin-top:4px}
  .rec .v small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:3px}
  /* cta */
  .cta{margin-top:20px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:20px}
  .cta h3{margin:0 0 4px;font-size:17px}
  .cta p{margin:0 0 14px;color:var(--muted);font-size:13px}
  .tiers{display:grid;gap:10px}
  .tier{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .tier .ti{font-size:14px;font-weight:700}
  .tier .ti small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
  .tier .pr{font-size:15px;font-weight:800;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
  .tier.pick{border-color:var(--accent)}
  .contact{margin-top:16px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px}
  .contact b{color:var(--accent)}
  .row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .copybtn{font-size:12px;padding:6px 12px;border-radius:8px;background:var(--accent);color:var(--accent-ink);border:none}
  .mono{font-variant-numeric:tabular-nums}
  .restart{margin-top:18px;text-align:center}
  .restart button{background:transparent;color:var(--muted);border:none;font-size:13px;text-decoration:underline}
  .foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
  @media (max-width:420px){ header h1{font-size:19px} .q{font-size:17px} .ring{width:150px;height:150px} .ring .n{font-size:38px} }
  :root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
</style>
</head>
<body>

<div class="wrap">

      </div>
      <span class="langsw" role="group" aria-label="language">

        <button type="button" data-lang="zh">中文</button>

  <main id="stage"></main>
</div>

      var txt="info@aikuagroup.com";
      function ok(){ var c=document.getElementById("copied"); c.hidden=false; setTimeout(function(){c.hidden=true;},1500); }
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok).catch(function(){ selectText("email"); }); }
      else { selectText("email"); }
    });
    function selectText(id){ var el=document.getElementById(id); var rng=document.createRange(); rng.selectNodeContents(el); var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(rng); }
    window.scrollTo(0,0);
  }

  // ================= 언어 전환 =================
  function applyLang(lang){
    LANG = lang;
    try{ localStorage.setItem("aikua_lang", lang); }catch(e){}
    document.documentElement.setAttribute("lang", lang==="zh"?"zh-CN":lang);
    var t=T();
    document.getElementById("kicker").textContent = t.kicker;
    document.getElementById("htitle").textContent = t.htitle;
    document.getElementById("hsub").textContent = t.hsub;
    document.querySelectorAll(".langsw button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lang")===lang); });
    if(view==="result"){ showResult(); } else { captureFollowup(); renderQuestion(); }
  }
  document.querySelectorAll(".langsw button").forEach(function(b){
    b.addEventListener("click", function(){ applyLang(b.getAttribute("data-lang")); });
  });

  // 초기 렌더
  applyLang(LANG);
})();
</script>
</body>
</html>
