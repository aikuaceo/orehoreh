<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIKUA BOX 진출 진단</title>
<style>
  /* Layout: single-column stepper on a branded navy canvas; one question per card, sticky progress, result screen with CTA. Dark-first (brand), light variant provided. */
  :root{
    --bg:#0b1733; --surface:#111f42; --surface2:#16254d; --line:#28385f;
    --fg:#f3f5fb; --muted:#9aa6c4; --accent:#f5a623; --accent-ink:#0b1733;
    --ok:#58c08a; --sel:#1d3568;
    --radius:14px; --maxw:720px;
    color-scheme:dark;
    --display:"Noto Sans KR",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f7fc; --surface:#ffffff; --surface2:#eef2fb; --line:#d9e1f0;
      --fg:#0b1733; --muted:#5a668c; --accent:#d98407; --accent-ink:#ffffff;
      --sel:#e9f0ff; color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#f4f7fc; --surface:#ffffff; --surface2:#eef2fb; --line:#d9e1f0;
    --fg:#0b1733; --muted:#5a668c; --accent:#d98407; --accent-ink:#ffffff;
    --sel:#e9f0ff; color-scheme:light;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--display);line-height:1.6;margin:0}
  .wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
  a{color:var(--accent)}
  .kicker{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.14em}
  /* header */
  header{padding-block:22px 10px}
  header h1{font-size:22px;font-weight:800;margin:6px 0 2px}
  header p{color:var(--muted);font-size:13px;margin:0}
  /* progress */
  .prog{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px 12px;z-index:5}
  .bar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .25s ease}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
  /* card */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .cat{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
  .q{font-size:19px;font-weight:700;margin:8px 0 18px;text-wrap:balance}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);cursor:pointer;font-size:15px;transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent);background:var(--sel)}
  .opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
  .opt.sel .dot{border-color:var(--accent)}
  .opt.sel .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* followup */
  .followup{margin-top:14px}
  .followup.hide{display:none}
  .followup label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted)}
  .followup textarea{width:100%;background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:15px;color:var(--fg);resize:vertical}
  .followup textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  /* nav */
  .nav{display:flex;gap:12px;margin-top:20px}
  button{font-family:inherit;font-size:15px;font-weight:700;border-radius:12px;padding:13px 20px;cursor:pointer;border:1.5px solid var(--line)}
  .btn-ghost{background:transparent;color:var(--fg)}
  .btn-ghost:disabled{opacity:.35;cursor:not-allowed}
  .btn-next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
  .btn-next:disabled{opacity:.4;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* result */
  .score-wrap{text-align:center;padding:10px 0 4px}
  .ring{--p:0;width:170px;height:170px;margin:4px auto 10px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(closest-side,var(--surface) 72%,transparent 73% 100%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0)}
  .ring .n{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .ring .n small{font-size:16px;color:var(--muted);font-weight:600}
  .grade{display:inline-block;font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px;background:var(--sel);color:var(--accent);margin-top:2px}
  .verdict{font-size:15px;margin:14px 2px 0;color:var(--fg)}
  .recs{display:grid;gap:12px;margin-top:18px}
  .rec{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .rec .l{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;text-transform:uppercase}
  .rec .v{font-size:15px;font-weight:700;margin-top:4px}
  .rec .v small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:3px}
  /* cta */
  .cta{margin-top:20px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:20px}
  .cta h3{margin:0 0 4px;font-size:17px}
  .cta p{margin:0 0 14px;color:var(--muted);font-size:13px}
  .tiers{display:grid;gap:10px}
  .tier{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .tier .ti{font-size:14px;font-weight:700}
  .tier .ti small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
  .tier .pr{font-size:15px;font-weight:800;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
  .tier.pick{border-color:var(--accent)}
  .contact{margin-top:16px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px}
  .contact b{color:var(--accent)}
  .row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .copybtn{font-size:12px;padding:6px 12px;border-radius:8px;background:var(--accent);color:var(--accent-ink);border:none}
  .mono{font-variant-numeric:tabular-nums}
  .restart{margin-top:18px;text-align:center}
  .restart button{background:transparent;color:var(--muted);border:none;font-size:13px;text-decoration:underline}
  .foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
  @media (max-width:420px){ header h1{font-size:19px} .q{font-size:17px} .ring{width:150px;height:150px} .ring .n{font-size:38px} }
  :root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="kicker">AIKUA BOX · 무료 진단</div>
    <h1>중국 진출 준비도 진단</h1>
    <p>20문항 · 약 3분 · 점수와 맞춤 진출 경로를 바로 드립니다</p>
  </header>

  <div class="prog" id="prog" hidden>
    <div class="bar"><i id="barfill"></i></div>
    <div class="meta"><span id="qcount">1 / 20</span><span id="catlabel"></span></div>
  </div>

  <main id="stage"></main>
</div>

<script>
(function(){
  "use strict";
  // ---- 문항 데이터 ----
  // score: 채점 반영 / route: 추천 산출용 키
  var Q = [
    {cat:"제품·인증", q:"브랜드 카테고리는 무엇인가요? (콰징몰 입점 서류가 달라집니다)", route:"product",
      o:[["화장품 (스킨케어·색조)","cosmetic"],["건기식·이너뷰티","health"],["패션·잡화","fashion"],["식품","food"],["생활용품·기타","etc"]]},
    {cat:"제품·인증", q:"중국 판매 인증(위생허가 NMPA 등) 상태는?",
      o:[["등록 완료",5],["진행 중",3],["모름·미시작",0]]},
    {cat:"제품·인증", q:"제품에 '중국에서 통할' 뚜렷한 차별점(성분·효능)이 있나요?",
      o:[["뚜렷하다",5],["보통이다",3],["잘 모르겠다",0]], followup:{i:0, label:"어떤 차별점인지 적어주세요 (성분·효능·기술 등)"}},
    {cat:"과거 경험", q:"중화권(중국·대만 등) 진출을 시도한 적 있나요?", route:"tried",
      o:[["해봤고 성과도 냈다",5],["시도했지만 실패했다",3],["이번이 처음이다",1]]},
    {cat:"과거 경험", q:"(시도했다면) 가장 크게 막힌 지점은?", route:"stuck",
      o:[["맞는 왕홍을 못 찾음","match"],["노출은 됐는데 매출이 안 남","convert"],["물류·통관","logi"],["비용이 과함","cost"],["운영을 못 이어감","ops"],["대행·왕홍을 신뢰 못 하겠음","trust"],["해당 없음","none"]]},
    {cat:"과거 경험", q:"현재 중국 관련 월 매출은 어느 정도인가요?", route:"rev",
      o:[["없음",0],["~1천만 원",2],["1천~5천만 원",4],["5천만 원 이상",5]]},
    {cat:"타겟·채널", q:"목표로 하는 중국 채널은?", route:"channel",
      o:[["샤오홍슈","xhs"],["더우인(틱톡)","douyin"],["콰이쇼우","kuaishou"],["타오바오·티몰","tmall"],["웨이신(위챗)","wechat"],["아직 모르겠다","unknown"]]},
    {cat:"타겟·채널", q:"타겟 고객층이 명확한가요?",
      o:[["명확하다",5],["대략 안다",3],["모르겠다",0]], followup:{i:0, label:"어떤 고객층인지 적어주세요 (나이·성별·상황)"}},
    {cat:"타겟·채널", q:"중국어로 소통 가능한 내부 인력이 있나요?",
      o:[["있다",5],["일부 가능",3],["없다",0]]},
    {cat:"타겟·채널", q:"왕홍·KOC와 협업해본 적 있나요?",
      o:[["여러 번 있다",5],["한두 번 있다",3],["없다",0]]},
    {cat:"예산", q:"중국 진출에 쓸 수 있는 초기 예산은?", route:"budget",
      o:[["~5백만 원",1],["5백~2천만 원",3],["2천만~1억 원",4],["1억 원 이상",5]]},
    {cat:"예산", q:"지속 가능한 월 마케팅 운영비는?",
      o:[["~1백만 원",1],["1백~5백만 원",3],["5백만 원 이상",5]]},
    {cat:"예산", q:"성과(매출) 연동 수수료 모델에 열려 있나요?", route:"commission",
      o:[["열려 있다","yes"],["조건부로 가능","maybe"],["아니오","no"]]},
    {cat:"물류·수출", q:"수출 경험이 있나요?",
      o:[["풀스택 경험 있음",5],["일부 경험",3],["없다",0]]},
    {cat:"물류·수출", q:"콰징(역직구)·보세창고 구조를 아나요?",
      o:[["잘 안다",5],["들어봤다",3],["모른다",0]]},
    {cat:"물류·수출", q:"재고·배송을 감당할 생산·공급 여력은?",
      o:[["충분하다",5],["보통이다",3],["부족하다",0]]},
    {cat:"콘텐츠·브랜드", q:"중국 소비자용 콘텐츠(현지어 영상·후기)가 있나요?",
      o:[["충분하다",5],["일부 있다",3],["없다",0]]},
    {cat:"콘텐츠·브랜드", q:"브랜드 스토리·한국 내 레퍼런스(수상·언론·매출)가 있나요?",
      o:[["강하다",5],["보통이다",3],["약하다",1]]},
    {cat:"콘텐츠·브랜드", q:"콘텐츠를 지속 제작할 리소스가 있나요?",
      o:[["내부 팀 있음",5],["외주 가능",3],["없다",0]]},
    {cat:"콘텐츠·브랜드", q:"3개월 목표에 가장 가까운 것은?", route:"goal",
      o:[["빠른 첫 매출","fast"],["매출과 브랜드 균형","balance"],["장기 브랜드 구축","brand"]]}
  ];

  var MAXSCORE = 0;
  Q.forEach(function(it){ if(!it.route){ var m=0; it.o.forEach(function(x){ if(x[1]>m)m=x[1]; }); MAXSCORE+=m; }
    else { // routed questions that still carry numeric points (tried, rev)
      var hasNum = it.o.some(function(x){return typeof x[1]==="number";});
      if(hasNum){ var mm=0; it.o.forEach(function(x){ if(typeof x[1]==="number" && x[1]>mm)mm=x[1]; }); MAXSCORE+=mm; }
    }
  });

  var answers = new Array(Q.length).fill(null);
  var idx = 0;
  var stage = document.getElementById("stage");
  var prog = document.getElementById("prog");
  var barfill = document.getElementById("barfill");
  var qcount = document.getElementById("qcount");
  var catlabel = document.getElementById("catlabel");

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function captureFollowup(){ var ta=document.getElementById("futext"); if(ta && answers[idx]) answers[idx].followupText = ta.value; }

  function renderQuestion(){
    prog.hidden = false;
    var it = Q[idx];
    barfill.style.width = ((idx)/Q.length*100)+"%";
    qcount.textContent = (idx+1)+" / "+Q.length;
    catlabel.textContent = it.cat;
    var html = '<section class="card">'
      + '<div class="cat">'+it.cat+'</div>'
      + '<div class="q">'+it.q+'</div>'
      + '<div class="opts" role="radiogroup">';
    it.o.forEach(function(opt,i){
      var selected = answers[idx]!==null && answers[idx].i===i;
      html += '<div class="opt'+(selected?' sel':'')+'" role="radio" tabindex="0" aria-checked="'+(selected?'true':'false')+'" data-i="'+i+'">'
        + '<span class="dot"></span><span>'+opt[0]+'</span></div>';
    });
    html += '</div>';
    if(it.followup){
      var fuShow = (answers[idx]!==null && answers[idx].i===it.followup.i);
      var fuVal = (answers[idx]&&answers[idx].followupText)?answers[idx].followupText:"";
      html += '<div class="followup'+(fuShow?'':' hide')+'" id="followup"><label for="futext">'+it.followup.label+'</label>'
        + '<textarea id="futext" rows="2" placeholder="자유롭게 적어주세요">'+esc(fuVal)+'</textarea></div>';
    }
    html += '<div class="nav">'
      + '<button class="btn-ghost" id="prev"'+(idx===0?' disabled':'')+'>이전</button>'
      + '<button class="btn-next" id="next"'+(answers[idx]===null?' disabled':'')+'>'+(idx===Q.length-1?'결과 보기':'다음')+'</button>'
      + '</div></section>';
    stage.innerHTML = html;

    Array.prototype.forEach.call(stage.querySelectorAll(".opt"), function(el){
      el.addEventListener("click", function(){ choose(parseInt(el.getAttribute("data-i"),10)); });
      el.addEventListener("keydown", function(e){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); choose(parseInt(el.getAttribute("data-i"),10)); } });
    });
    document.getElementById("prev").addEventListener("click", function(){ if(idx>0){ captureFollowup(); idx--; renderQuestion(); window.scrollTo(0,0);} });
    document.getElementById("next").addEventListener("click", function(){
      if(answers[idx]===null) return;
      captureFollowup();
      if(idx<Q.length-1){ idx++; renderQuestion(); window.scrollTo(0,0); } else { showResult(); }
    });
  }

  function choose(i){
    var opt = Q[idx].o[i];
    answers[idx] = {i:i, label:opt[0], val:opt[1]};
    // reflect selection
    Array.prototype.forEach.call(stage.querySelectorAll(".opt"), function(el){
      var on = parseInt(el.getAttribute("data-i"),10)===i;
      el.classList.toggle("sel", on); el.setAttribute("aria-checked", on?"true":"false");
    });
    if(Q[idx].followup){
      var fu = document.getElementById("followup");
      if(fu) fu.classList.toggle("hide", i !== Q[idx].followup.i);
    }
    document.getElementById("next").disabled = false;
  }

  function computeScore(){
    var got=0;
    Q.forEach(function(it,qi){
      var a=answers[qi]; if(!a) return;
      if(typeof a.val==="number") got+=a.val;
    });
    return Math.round(got/MAXSCORE*100);
  }

  function pick(routeKey){
    for(var i=0;i<Q.length;i++){ if(Q[i].route===routeKey && answers[i]) return answers[i].val; }
    return null;
  }
  function label(routeKey){
    for(var i=0;i<Q.length;i++){ if(Q[i].route===routeKey && answers[i]) return answers[i].label; }
    return null;
  }

  function grade(s){
    if(s>=80) return {t:"바로 실행 단계", d:"준비가 충분해요. 진단 리포트를 건너뛰고 '매칭·운영 동행'으로 바로 가도 됩니다."};
    if(s>=60) return {t:"준비 양호", d:"기본기가 탄탄해요. 진단 리포트로 약점 한두 개만 메우고 큐시트로 시작하세요."};
    if(s>=40) return {t:"보완 필요", d:"가능성은 있지만 빈틈이 있어요. 진단 리포트로 가장 약한 축부터 보완하세요."};
    return {t:"기초 세팅 단계", d:"지금 뛰어들면 돈만 써요. 먼저 베이직 솔루션 보고서로 인증·채널 기초부터 짚으세요."};
  }

  function recommend(){
    var product = pick("product");
    var channel = pick("channel");
    var rev = pick("rev");
    var budget = pick("budget");
    var goal = pick("goal");
    var stuck = pick("stuck");

    // 추천 채널·방식
    var chName = {xhs:"샤오홍슈",douyin:"더우인(틱톡)",tmall:"타오바오·티몰",wechat:"웨이신",unknown:null}[channel];
    var path;
    if(rev!==null && rev>=4){
      path = (chName||"더우인") + " 왕홍 라이브 + 콰징 풀필먼트로 매출 스케일업";
    } else if(rev===0 || rev===null){
      path = (chName||"샤오홍슈") + " KOC 체험단 + 기업 계정 운영부터 (인지도·후기 먼저)";
    } else {
      path = (chName||"샤오홍슈") + " 콘텐츠 운영 + 중견 왕홍 캠페인으로 전환율 올리기";
    }

    // 왕홍 유형 (예산 기반)
    var whType;
    if(budget===null||budget<=1) whType = "KOC 다수(저비용 체험단) 중심";
    else if(budget<=3) whType = "KOC + 중견 왕홍 혼합";
    else whType = "메가 왕홍 라이브 + 중견 왕홍 조합";

    // 제품군 한 줄
    var prodLine = {cosmetic:"화장품",health:"건기식·이너뷰티(인증 난도 높음)",fashion:"패션·잡화",food:"식품(검역 유의)",etc:"해당 품목"}[product] || "해당 품목";

    // 다음 액션
    var stuckLine = {match:"왕홍 매칭",convert:"매출 전환",logi:"물류·통관",cost:"비용 구조",ops:"운영 지속",none:null}[stuck];

    return {path:path, whType:whType, prodLine:prodLine, stuckLine:stuckLine, goal:goal};
  }

  function showResult(){
    var s = computeScore();
    var g = grade(s);
    var r = recommend();
    prog.hidden = true;
    barfill.style.width = "100%";

    var report = '<div class="tier pick"><div class="ti">베이직 솔루션 보고서 · 여기서 시작 <small>현재 브랜드 문제점 + 해결방안 컨설팅</small></div><div class="pr">9.9만</div></div>';
    var tiers;
    if(s>=80){
      tiers = report + '<div class="tier"><div class="ti">다음 단계 · 매칭·운영 동행 <small>왕홍 매칭 + 월 운영 (최소 3개월)</small></div><div class="pr">월 500만~</div></div>';
    } else if(s>=60){
      tiers = report + '<div class="tier"><div class="ti">다음 단계 · 정밀 리포트 <small>경쟁 분석 + 실왕홍 명단 + ROI</small></div><div class="pr">66만</div></div>';
    } else if(s>=40){
      tiers = report + '<div class="tier"><div class="ti">다음 단계 · 큐시트+숏폼 팩 <small>현지어 콘텐츠로 전환율 올리기</small></div><div class="pr">건당 50만~</div></div>';
    } else {
      tiers = report + '<div class="tier"><div class="ti">다음 단계 · 정밀 리포트 <small>기초가 갖춰지면</small></div><div class="pr">66만</div></div>';
    }

    var stuckHtml = r.stuckLine ? '<div class="rec"><div class="l">지난 실패 지점</div><div class="v">'+r.stuckLine+'<small>이 지점을 먼저 설계에 반영합니다</small></div></div>' : '';
    var diffTxt = (answers[2]&&answers[2].followupText&&answers[2].followupText.trim())?answers[2].followupText.trim():'';
    var segTxt = (answers[7]&&answers[7].followupText&&answers[7].followupText.trim())?answers[7].followupText.trim():'';
    var diffHtml = diffTxt ? '<div class="rec"><div class="l">우리 차별점</div><div class="v">'+esc(diffTxt)+'</div></div>' : '';
    var segHtml = segTxt ? '<div class="rec"><div class="l">핵심 타겟 고객층</div><div class="v">'+esc(segTxt)+'</div></div>' : '';

    stage.innerHTML =
      '<section class="card">'
      + '<div class="score-wrap">'
      +   '<div class="cat">진출 준비도</div>'
      +   '<div class="ring" style="--p:'+s+'"><div class="n">'+s+'<small>/100</small></div></div>'
      +   '<div class="grade">'+g.t+'</div>'
      +   '<p class="verdict">'+g.d+'</p>'
      + '</div>'
      + '<div class="recs">'
      +   '<div class="rec"><div class="l">추천 진출 경로</div><div class="v">'+r.path+'<small>'+r.prodLine+' · 현재 단계 기준</small></div></div>'
      +   '<div class="rec"><div class="l">추천 왕홍 유형</div><div class="v">'+r.whType+'</div></div>'
      +   diffHtml + segHtml + stuckHtml
      + '</div>'
      + '</section>'
      + '<div class="cta">'
      +   '<h3>다음 단계</h3>'
      +   '<p>이 진단은 요약이에요. 9.9만 베이직 솔루션 보고서로 시작해, 준비도에 맞는 다음 단계로 올라가세요.</p>'
      +   '<div class="tiers">'+tiers+'</div>'
      +   '<a href="index.html#pricing" style="display:block;text-align:center;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:14px;margin-top:14px;text-decoration:none">9.9만원으로 바로 시작하기 →</a>'
      +   '<div class="contact" style="margin-top:14px">문의하고 바로 시작하기 — <b>info@aikuagroup.com</b>'
      +     '<div class="row"><span class="mono" id="email">info@aikuagroup.com</span>'
      +     '<button class="copybtn" id="copy">이메일 복사</button><span id="copied" style="color:var(--ok);font-size:12px" hidden>복사됨</span></div>'
      +   '</div>'
      + '</div>'
      + '<div class="restart"><button id="restart">진단 다시 하기</button></div>'
      + '<p class="foot">AIKUA BOX · ㈜아이콰그룹 · Unbox Your Global Market<br>진단 결과는 참고용 요약이며, 상세 분석은 리포트에서 제공됩니다.</p>';

    document.getElementById("restart").addEventListener("click", function(){
      answers = new Array(Q.length).fill(null); idx=0; renderQuestion(); window.scrollTo(0,0);
    });
    var copyBtn = document.getElementById("copy");
    copyBtn.addEventListener("click", function(){
      var txt="info@aikuagroup.com";
      function ok(){ var c=document.getElementById("copied"); c.hidden=false; setTimeout(function(){c.hidden=true;},1500); }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(ok).catch(function(){ selectText("email"); });
      } else { selectText("email"); }
    });
    function selectText(id){ var el=document.getElementById(id); var rng=document.createRange(); rng.selectNodeContents(el); var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(rng); }
    window.scrollTo(0,0);
  }

  renderQuestion();
})();
</script>
