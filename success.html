<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 완료 — AIKUA BOX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{--font:"Pretendard Variable","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;}
  body{margin:0;font-family:var(--font);background:#0b1733;color:#f3f5fb;display:grid;place-items:center;min-height:100vh;padding:20px;letter-spacing:-.01em}
  .box{background:#111f42;border:1px solid #28385f;border-radius:16px;padding:40px 34px;max-width:480px;width:100%;text-align:center;position:relative}
  .langsw{position:absolute;top:14px;right:14px;display:inline-flex;gap:2px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:3px}
  .langsw button{background:transparent;border:none;color:#aeb8d4;font-size:11.5px;font-weight:700;font-family:inherit;padding:4px 8px;border-radius:6px;cursor:pointer}
  .langsw button.on{background:#f5a623;color:#0b1733}
  .ic{width:64px;height:64px;border-radius:50%;background:#f5a623;color:#0b1733;font-size:34px;display:grid;place-items:center;margin:6px auto 18px;font-weight:800}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#9aa6c4;font-size:14px;margin:0 0 10px}
  .info{background:#16254d;border-radius:10px;padding:14px;font-size:13px;color:#cdd5ea;text-align:left;margin:16px 0;word-break:break-all}
  .cta{display:block;background:#f5a623;color:#0b1733;font-weight:800;text-decoration:none;border-radius:12px;padding:15px 24px;margin:18px 0 8px;font-size:15.5px}
  .cta .sm{display:block;font-size:12px;font-weight:600;color:#5a4a1a;margin-top:2px}
  a.home{display:inline-block;color:#9aa6c4;font-size:13px;text-decoration:underline;margin-top:6px}
  .warn{color:#e8976b;font-size:12px;margin-top:12px}
</style>
</head>
<body>
  <div class="box">
    <span class="langsw" role="group" aria-label="language">
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </span>
    <div class="ic">✓</div>
    <h1 data-i18n="h">결제가 접수되었습니다</h1>
    <p data-i18n="p">담당자가 확인 후 1영업일 내 연락드립니다.</p>
    <div class="info" id="info" data-i18n="loading">결제 정보를 불러오는 중…</div>

    <a class="cta" id="ndalink" href="nda.html" hidden>
      <span data-i18n="nda_cta">🔐 비밀유지계약(NDA) 작성하러 가기 →</span>
      <span class="sm" data-i18n="nda_cta_sm">정밀 진단은 NDA 체결 후 시작됩니다 · 2분 소요</span>
    </a>

    <a class="cta" id="qlink" href="questionnaire.html" hidden>
      <span data-i18n="cta">브랜드 심화 질의지 바로 작성하기 →</span>
      <span class="sm" data-i18n="cta_sm">3분이면 끝 · 작성해주시면 맞춤 리포트가 빨라집니다</span>
    </a>

    <p class="warn" id="warn" hidden data-i18n="warn">※ 아직 최종 승인(confirm) 서버가 연결되지 않았습니다. 배포 가이드의 서버 설정을 완료하면 자동 승인됩니다.</p>
    <a class="home" href="/" data-i18n="home">홈으로</a>
  </div>
<script>
var I18N = {
  en:{ h:"Payment received", p:"We'll review and contact you within 1 business day.",
    loading:"Loading payment details…", cta:"Fill in the Brand Deep-Dive Questionnaire now →",
    cta_sm:"Takes 3 minutes · it speeds up your tailored report",
    warn:"※ The approval (confirm) server isn't connected yet. It auto-approves once you finish the server setup in the deploy guide.",
    home:"Home", approved:"Payment approved.", failed:"Approval failed", processing:"Approving…",
    order:"Order no.", amount:"Amount", none:"No payment info.",
    nda_cta:"🔐 Sign the NDA now →", nda_cta_sm:"The in-depth diagnosis starts after the NDA is signed · ~2 min" },
  zh:{ h:"付款已受理", p:"我们确认后将在1个工作日内与您联系。",
    loading:"正在加载付款信息…", cta:"立即填写品牌深度问卷 →",
    cta_sm:"3分钟即可 · 填写后定制报告更快",
    warn:"※ 审批(confirm)服务器尚未连接。完成部署指南中的服务器设置后将自动审批。",
    home:"返回首页", approved:"付款已成功审批。", failed:"审批失败", processing:"审批中…",
    order:"订单号", amount:"金额", none:"无付款信息。",
    nda_cta:"🔐 立即签署保密协议(NDA) →", nda_cta_sm:"精密诊断在签署NDA后开始 · 约2分钟" }
};
var T = {}; // 현재 언어 사전 접근용
(function(){
  var KO={}; var CUR="ko";
  document.querySelectorAll("[data-i18n]").forEach(function(el){ KO[el.getAttribute("data-i18n")]=el.innerHTML; });
  // 동적 문구(결제정보)용 한국어 기본값 — HTML에 data-i18n 요소가 없는 키
  KO.order="결제 주문번호"; KO.amount="금액"; KO.approved="결제가 정상 승인되었습니다.";
  KO.failed="승인 실패"; KO.processing="승인 처리 중…"; KO.none="결제 정보가 없습니다.";
  window.__KO = KO;
  window.tr = function(k){ var d=(CUR==="ko")?KO:(I18N[CUR]||KO); return (d[k]!=null?d[k]:KO[k]); };
  function apply(lang){
    CUR=lang;
    var d=(lang==="ko")?null:I18N[lang];
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var k=el.getAttribute("data-i18n"); var v=d?d[k]:KO[k]; if(v==null)v=KO[k]; if(v!=null)el.innerHTML=v;
    });
    document.documentElement.setAttribute("lang", lang==="zh"?"zh-CN":lang);
    document.querySelectorAll(".langsw button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lang")===lang); });
    try{ localStorage.setItem("aikua_lang",lang); }catch(e){}
    renderInfo(); // 언어 바뀌면 결제정보 문구도 갱신
  }
  document.querySelectorAll(".langsw button").forEach(function(b){ b.addEventListener("click",function(){ apply(b.getAttribute("data-lang")); }); });
  var saved="ko"; try{ saved=localStorage.getItem("aikua_lang")||"ko"; }catch(e){}
  if(saved!=="ko" && !I18N[saved]) saved="ko";
  window.__applyLang = apply; window.__initLang = saved;
})();

var q = new URLSearchParams(location.search);
var paymentKey=q.get("paymentKey"), orderId=q.get("orderId"), amount=q.get("amount");
var state = { status:"loading" };

function renderInfo(){
  var info=document.getElementById("info");
  if(!orderId){ info.textContent = tr("none"); return; }
  var amt = amount ? Number(amount).toLocaleString() : "-";
  var line = tr("order")+": "+orderId+"<br>"+tr("amount")+": "+amt;
  if(state.status==="processing") line += "<br>"+tr("processing");
  else if(state.status==="approved") line += "<br><b style='color:#58c08a'>"+tr("approved")+"</b>";
  else if(state.status==="failed") line += "<br><b style='color:#e8976b'>"+tr("failed")+": "+(state.msg||"")+"</b>";
  info.innerHTML = line;
}

// 질의지 링크에 주문번호 전달 + 바로 노출
function showQuestionnaire(){
  var a=document.getElementById("qlink");
  a.href = "questionnaire.html" + (orderId? ("?order="+encodeURIComponent(orderId)) : "");
  a.hidden = false;
}

// 정밀 진단(STEP2, nda=1) 결제자 → NDA 작성 우선 노출
var ndaFlag = q.get("nda") === "1";
function showNda(){
  if(!ndaFlag) return;
  var a=document.getElementById("ndalink");
  a.href = "nda.html" + (orderId? ("?order="+encodeURIComponent(orderId)) : "");
  a.hidden = false;
  var ql=document.getElementById("qlink"); // NDA가 우선이므로 질의지는 보조 스타일
  ql.style.background="#16254d"; ql.style.color="#f3f5fb";
  var sm=ql.querySelector(".sm"); if(sm) sm.style.color="#9aa6c4";
}

window.__applyLang(window.__initLang);
showNda();

if (paymentKey && orderId && amount) {
  state.status="processing"; renderInfo();
  fetch("/api/confirm",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({paymentKey:paymentKey,orderId:orderId,amount:Number(amount)})})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(res){
      if(res.ok){ state.status="approved"; }
      else { state.status="failed"; state.msg=(res.d&&res.d.message)||""; document.getElementById("warn").hidden=false; }
      renderInfo(); showQuestionnaire();   // 승인 여부와 무관하게, 결제 접수된 구매자에겐 질의지 바로 노출
    })
    .catch(function(){ state.status="idle"; renderInfo(); document.getElementById("warn").hidden=false; showQuestionnaire(); });
} else if (orderId) {
  state.status="idle"; renderInfo(); document.getElementById("warn").hidden=false; showQuestionnaire();
} else {
  renderInfo();
}
</script>
</body>
</html>
