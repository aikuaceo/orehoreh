plugins {
    id 'com.android.application'
}

// 광고/팝업 차단 스크립트는 데스크톱과 같은 파일을 쓴다
def guardDir = layout.buildDirectory.dir("generated/guard")
tasks.register('copyGuard', Copy) {
    from "${rootDir}/../desktop/src/page-guard.js"
    into guardDir
}
preBuild.dependsOn copyGuard

android {
    namespace 'com.freeway.browser'
    compileSdk 34

    defaultConfig {
        applicationId 'com.freeway.browser'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        // 고정 서명키: 새 버전을 기존 앱 위에 그대로 업데이트 설치할 수 있게
        freeway {
            storeFile file('freeway.keystore')
            storePassword 'freeway-browser'
            keyAlias 'freeway'
            keyPassword 'freeway-browser'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.freeway
        }
        debug {
            signingConfig signingConfigs.freeway
        }
    }

    sourceSets {
        main.assets.srcDirs += guardDir
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
