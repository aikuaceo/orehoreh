<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구독 완료 — AIKUA BOX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{--font:"Pretendard Variable","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;}
  body{margin:0;font-family:var(--font);background:#0b1733;color:#f3f5fb;display:grid;place-items:center;min-height:100vh;padding:20px;letter-spacing:-.01em}
  .box{background:#111f42;border:1px solid #28385f;border-radius:16px;padding:40px 34px;max-width:480px;width:100%;text-align:center}
  .ic{width:64px;height:64px;border-radius:50%;background:#f5a623;color:#0b1733;font-size:34px;display:grid;place-items:center;margin:0 auto 18px;font-weight:800}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#9aa6c4;font-size:14px;margin:0 0 10px}
  .info{background:#16254d;border-radius:10px;padding:14px;font-size:13px;color:#cdd5ea;text-align:left;margin:16px 0;word-break:break-all}
  a.btn{display:inline-block;background:#f5a623;color:#0b1733;font-weight:700;text-decoration:none;border-radius:10px;padding:12px 24px;margin-top:8px}
  .warn{color:#e8976b;font-size:12px;margin-top:12px}
</style>
</head>
<body>
  <div class="box">
    <div class="ic">✓</div>
    <h1>구독(정기결제)이 접수되었습니다</h1>
    <p>카드 등록 후 매월 자동으로 결제됩니다. 담당자가 1영업일 내 연락드립니다.</p>
    <div class="info" id="info">처리 중…</div>
    <p class="warn" id="warn" hidden>※ 아직 빌링 승인 서버가 연결되지 않았습니다. Vercel의 TOSS_SECRET_KEY(일반 시크릿 키 test_sk_)와 재배포를 확인해주세요.</p>
    <a class="btn" href="/">홈으로</a>
  </div>
<script>
  var q = new URLSearchParams(location.search);
  var authKey = q.get("authKey"), customerKey = q.get("customerKey");
  var amount = q.get("amount"), name = q.get("name");
  var info = document.getElementById("info");
  if (authKey && customerKey && amount) {
    info.innerHTML = "상품: " + (name || "구독") + "<br>월 금액: " + Number(amount).toLocaleString() + "원<br>카드 등록·첫 결제 처리 중…";
    fetch("/api/billing-issue", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ authKey: authKey, customerKey: customerKey, amount: Number(amount), orderName: name || "AIKUA BOX 구독" })
    })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        if (res.ok) {
          info.innerHTML = "상품: " + (name || "구독") + "<br>월 금액: " + Number(amount).toLocaleString() + "원<br><b style='color:#58c08a'>카드 등록 완료 · 첫 결제가 승인되었습니다. 매월 자동 결제됩니다.</b>";
        } else {
          var step = res.d && res.d.step === "charge" ? "첫 결제" : "카드 등록(빌링키 발급)";
          info.innerHTML = "상품: " + (name || "구독") + "<br><b style='color:#e8976b'>" + step + " 실패: " + (res.d && res.d.message ? res.d.message : "오류") + "</b>";
          document.getElementById("warn").hidden = false;
        }
      })
      .catch(function(){
        info.innerHTML = "카드 등록 정보: " + customerKey;
        document.getElementById("warn").hidden = false;
      });
  } else {
    info.textContent = "구독 등록 정보가 없습니다.";
  }
</script>
</body>
</html>
