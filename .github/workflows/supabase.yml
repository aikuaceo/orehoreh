# Deploys the OREH payment server (supabase/) whenever it changes on main, or on demand.
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
#              SUPABASE_DB_PASSWORD   (optional; without it the CLI signs in with a temporary role)
#   Variables: SUPABASE_PROJECT_REF   (optional; defaults to OREH's project mrejcsrkqsoexzyhgtpa)
# Optional secrets: TOSS_SECRET_KEY, ADMIN_TOKEN, GOOGLE_TTS_API_KEY
# Until the token and project ref exist, the job skips itself and the site stays in preview mode.
name: Deploy payment server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'mrejcsrkqsoexzyhgtpa' }}
    steps:
      - name: Check setup
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Supabase is not connected yet. Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF, then run this workflow again."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - uses: supabase/setup-cli@v1
        if: env.SKIP != '1'
        with:
          version: latest

      - name: Link project
        if: env.SKIP != '1'
        run: supabase link --project-ref "$PROJECT_REF" ${SUPABASE_DB_PASSWORD:+--password "$SUPABASE_DB_PASSWORD"}

      - name: Database (migrations and seed)
        if: env.SKIP != '1'
        run: supabase db push --include-seed ${SUPABASE_DB_PASSWORD:+--password "$SUPABASE_DB_PASSWORD"}

      - name: Function secrets
        if: env.SKIP != '1'
        env:
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          # Until OREH has its own Toss keys, use Toss's public documentation test key (no real charges).
          # It pairs with the documentation client key test_gck_docs_... in index.html.
          TOSS="${TOSS_SECRET_KEY:-test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}"
          set -- "ALLOWED_ORIGINS=https://orehoreh.com,https://www.orehoreh.com" "TOSS_SECRET_KEY=$TOSS"
          if [ -n "$ADMIN_TOKEN" ]; then set -- "$@" "ADMIN_TOKEN=$ADMIN_TOKEN"; fi
          if [ -n "$GOOGLE_TTS_API_KEY" ]; then set -- "$@" "GOOGLE_TTS_API_KEY=$GOOGLE_TTS_API_KEY"; fi
          supabase secrets set --project-ref "$PROJECT_REF" "$@"

      - name: Edge Functions
        if: env.SKIP != '1'
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Summary
        if: env.SKIP != '1'
        run: |
          {
            echo "### Payment server deployed"
            echo "- API: https://$PROJECT_REF.supabase.co"
            echo "- Toss webhook URL: https://$PROJECT_REF.supabase.co/functions/v1/toss-webhook"
          } >> "$GITHUB_STEP_SUMMARY"
