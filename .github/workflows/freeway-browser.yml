# Freeway 브라우저 빌드 — 안드로이드 APK + Windows 설치파일/포터블 exe
# browser/ 폴더가 바뀌면 자동으로 빌드하고, GitHub Releases 에 올려서 휴대폰/PC에서 바로 받을 수 있게 한다.
name: Freeway browser

on:
  workflow_dispatch:
  push:
    branches: [main, ccr-04ce065b-oecpd2]
    paths: ['browser/**', '.github/workflows/freeway-browser.yml']

permissions:
  contents: write

concurrency:
  group: freeway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 우회 엔진 / HLS 테스트
        working-directory: browser/desktop
        run: |
          node test/proxy.test.js
          node test/hls.test.js

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK 빌드
        working-directory: browser/android
        run: gradle --no-daemon assembleRelease
      - name: 이름 정리
        run: cp browser/android/app/build/outputs/apk/release/app-release.apk Freeway-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Freeway-Android.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 설치파일 빌드
        working-directory: browser/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            browser/desktop/dist/*.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 릴리스 게시
        uses: softprops/action-gh-release@v2
        with:
          tag_name: freeway-v1.0.${{ github.run_number }}
          name: Freeway 브라우저 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **휴대폰(안드로이드)**: `Freeway-Android.apk` 를 눌러 받은 뒤 설치하세요. ("출처를 알 수 없는 앱" 설치 허용이 필요할 수 있습니다)
            **PC(Windows)**: `Freeway-Setup-*.exe`(설치형) 또는 `Freeway-Portable-*.exe`(설치 없이 실행)를 받으세요.

            - VPN 우회(통신사 SNI·DNS 차단 우회)가 기본으로 켜져 있습니다.
            - 광고·팝업·우클릭 광고 차단, 우클릭(휴대폰은 길게 누르기)으로 동영상 다운로드.
          files: out/*
