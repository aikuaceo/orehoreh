<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 실패 — AIKUA BOX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{--font:"Pretendard Variable","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;}
  body{margin:0;font-family:var(--font);background:#0b1733;color:#f3f5fb;display:grid;place-items:center;min-height:100vh;padding:20px;letter-spacing:-.01em}
  .box{background:#111f42;border:1px solid #28385f;border-radius:16px;padding:40px 34px;max-width:460px;text-align:center;position:relative}
  .langsw{position:absolute;top:14px;right:14px;display:inline-flex;gap:2px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:3px}
  .langsw button{background:transparent;border:none;color:#aeb8d4;font-size:11.5px;font-weight:700;font-family:inherit;padding:4px 8px;border-radius:6px;cursor:pointer}
  .langsw button.on{background:#f5a623;color:#0b1733}
  .ic{width:64px;height:64px;border-radius:50%;background:#e5736b;color:#fff;font-size:34px;display:grid;place-items:center;margin:6px auto 18px;font-weight:800}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#9aa6c4;font-size:14px;margin:0 0 10px}
  .info{background:#16254d;border-radius:10px;padding:14px;font-size:13px;color:#cdd5ea;margin:16px 0}
  a.btn{display:inline-block;background:#f5a623;color:#0b1733;font-weight:700;text-decoration:none;border-radius:10px;padding:12px 24px;margin-top:8px}
</style>
</head>
<body>
  <div class="box">
    <span class="langsw" role="group" aria-label="language">
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </span>
    <div class="ic">!</div>
    <h1 data-i18n="h">결제가 완료되지 않았습니다</h1>
    <p data-i18n="p">다시 시도하시거나 info@aikuagroup.com 으로 문의해주세요.</p>
    <div class="info" id="info"></div>
    <a class="btn" href="/#pricing" data-i18n="retry">다시 결제하기</a>
  </div>
<script>
var I18N={
  en:{ h:"Payment was not completed", p:"Please try again or contact info@aikuagroup.com.", retry:"Pay again", canceled:"Payment was canceled." },
  zh:{ h:"付款未完成", p:"请重试或联系 info@aikuagroup.com。", retry:"重新付款", canceled:"付款已取消。" }
};
var KO={};
document.querySelectorAll("[data-i18n]").forEach(function(el){ KO[el.getAttribute("data-i18n")]=el.innerHTML; });
function tr(k){ var l=document.documentElement.getAttribute("lang"); var d=(l==="ko")?KO:(I18N[l]||KO); return d[k]!=null?d[k]:KO[k]; }
function apply(lang){
  var d=(lang==="ko")?null:I18N[lang];
  document.querySelectorAll("[data-i18n]").forEach(function(el){ var k=el.getAttribute("data-i18n"); var v=d?d[k]:KO[k]; if(v==null)v=KO[k]; if(v!=null)el.innerHTML=v; });
  document.documentElement.setAttribute("lang", lang==="zh"?"zh-CN":lang);
  document.querySelectorAll(".langsw button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lang")===lang); });
  try{ localStorage.setItem("aikua_lang",lang); }catch(e){}
  renderInfo();
}
document.querySelectorAll(".langsw button").forEach(function(b){ b.addEventListener("click",function(){ apply(b.getAttribute("data-lang")); }); });
var q=new URLSearchParams(location.search); var msg=q.get("message"), code=q.get("code");
function renderInfo(){ document.getElementById("info").textContent = msg ? (msg+(code?" ("+code+")":"")) : tr("canceled"); }
var saved="ko"; try{ saved=localStorage.getItem("aikua_lang")||"ko"; }catch(e){}
if(saved!=="ko" && !I18N[saved]) saved="ko";
apply(saved);
</script>
</body>
</html>
