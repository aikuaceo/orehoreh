<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구독(정기결제) — AIKUA BOX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<!-- 토스페이먼츠 SDK (v2) — 자동결제(빌링)은 일반 결제 객체 payment() 사용 -->
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
  :root{--navy:#0b1733;--accent:#f5a623;--ink:#15213d;--muted:#5a668c;--line:#e2e7f2;--soft:#f4f7fc;
    --font:"Pretendard Variable","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--ink);background:#eef2f9;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  .top{background:var(--navy);color:#fff}
  .top .in{max-width:620px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;font-size:16px}.logo b{color:var(--accent)}
  .top a{color:#aeb8d4;font-size:13px;text-decoration:none}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px 60px}
  .order{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
  .badge{display:inline-block;background:var(--navy);color:var(--accent);font-size:11px;font-weight:800;border-radius:20px;padding:3px 11px;letter-spacing:.04em;margin-bottom:10px}
  .order .nm{font-size:17px;font-weight:700;color:var(--navy);margin:2px 0 14px;line-height:1.4}
  .order .amt{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:14px}
  .order .amt b{font-size:24px;font-weight:800;color:var(--navy)}
  .order .amt .per{font-size:14px;color:var(--muted);font-weight:600}
  .info{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:16px}
  #payBtn{width:100%;background:var(--accent);color:var(--navy);border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer}
  #payBtn:disabled{opacity:.5;cursor:default}
  .note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}
  .err{background:#fff;border:1px solid #e5736b;color:#b23b32;border-radius:12px;padding:16px;font-size:13.5px;line-height:1.6;margin-top:14px}
  .err b{color:#8a2820}
</style>
</head>
<body>
  <div class="top"><div class="in"><span class="logo">AIKUA <b>BOX</b></span><a href="/">← 홈으로</a></div></div>
  <div class="wrap">
    <div class="order">
      <span class="badge">월 정기결제 · 구독</span>
      <div class="nm" id="orderName">—</div>
      <div class="amt"><span style="color:var(--muted);font-size:13px">월 결제 금액</span><b class="num"><span id="orderAmount">—</span> <span class="per">/ 월</span></b></div>
    </div>
    <div class="info">카드를 등록하면 <b>매월 자동으로 결제</b>됩니다. 지금 화면에서는 <b>카드 등록(빌링)</b>을 진행하고, 등록 완료 시 첫 회차가 결제됩니다. 해지는 info@aikuagroup.com · 010-7207-0642 로 요청하실 수 있어요.</div>
    <button id="payBtn" disabled>카드 등록하고 구독 시작</button>
    <div id="errbox"></div>
    <p class="note">토스페이먼츠 자동결제(빌링)로 안전하게 처리됩니다.<br>문의: info@aikuagroup.com · 010-7207-0642</p>
  </div>

<script>
  // ===== 토스 '일반' 클라이언트 키 (API 개별 연동 / 빌링용) =====
  // ⚠️ 결제위젯 키(test_gck_)가 아니라, '일반 클라이언트 키(test_ck_...)' 를 넣으세요.
  //    개발자센터 → API 키 → (API 개별 연동) 클라이언트 키. 실결제 전 live_ck_ 로 교체.
  var BILLING_CLIENT_KEY = "test_ck_PBal2vxj81LpkY77BJJer5RQgOAN";

  var q = new URLSearchParams(location.search);
  var amount = parseInt(q.get("amount"), 10) || 0;
  var orderName = q.get("name") || "AIKUA BOX 구독";
  document.getElementById("orderName").textContent = orderName;
  document.getElementById("orderAmount").textContent = amount.toLocaleString() + "원";

  function showErr(msg){ document.getElementById("errbox").innerHTML = '<div class="err">'+msg+'</div>'; }

  // customerKey: 10~50자, 특수문자(-_=.@) 1개 이상 포함, 추측 불가한 랜덤값
  function makeCustomerKey(){
    var a = new Uint8Array(16);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return "cust_" + Array.prototype.map.call(a, function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
  }

  (function(){
    if (typeof TossPayments === "undefined" || !amount) {
      showErr("결제 정보를 불러오지 못했습니다. 홈에서 다시 시도하거나 info@aikuagroup.com 으로 문의해주세요.");
      return;
    }
    if (BILLING_CLIENT_KEY.indexOf("__여기에") !== -1 || BILLING_CLIENT_KEY.indexOf("test_gck_") === 0) {
      showErr("<b>빌링(자동결제) 클라이언트 키가 설정되지 않았습니다.</b><br>개발자센터 → API 키의 <b>일반 클라이언트 키(test_ck_...)</b>를 subscribe.html의 BILLING_CLIENT_KEY 에 넣어주세요. (위젯 키 test_gck_ 는 빌링에 쓸 수 없습니다.)");
      return;
    }
    try {
      var customerKey = makeCustomerKey();
      var tossPayments = TossPayments(BILLING_CLIENT_KEY);
      var payment = tossPayments.payment({ customerKey: customerKey });
      var btn = document.getElementById("payBtn");
      btn.disabled = false;
      btn.addEventListener("click", async function(){
        btn.disabled = true;
        try {
          await payment.requestBillingAuth({
            method: "CARD",
            successUrl: location.origin + "/billing-success.html?amount=" + encodeURIComponent(amount) + "&name=" + encodeURIComponent(orderName),
            failUrl: location.origin + "/fail.html",
            customerName: "구독자"
          });
        } catch(err){
          btn.disabled = false;
          if (err && err.code === "USER_CANCEL") return;
          showErr("카드 등록을 시작하지 못했습니다: " + (err && err.message ? err.message : "알 수 없는 오류"));
        }
      });
    } catch(e){
      showErr("결제 모듈 초기화에 실패했습니다. 클라이언트 키를 확인해주세요. (" + (e && e.message ? e.message : "오류") + ")");
    }
  })();
</script>
</body>
</html>
